name: Build & Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build Vite + Electron
        run: npm run build

      - name: Package EXE
        run: npm run package

      - name: Upload EXE artifact (PR)
        if: startsWith(github.ref, 'refs/heads/')
        uses: actions/upload-artifact@v4
        with:
          name: Roam-Portable
          path: dist/Roam*-portable.exe
          retention-days: 1

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $exe = Get-ChildItem -Path dist -Filter "Roam*-portable.exe"
          gh release create $env:TAG_NAME `
            --title $env:TAG_NAME `
            --generate-notes `
            $exe.FullName
